name: Update public wallet balances

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'mundodr/ten-dollar-wallet-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read balances and update page
        run: |
          if [ -f .goal-reached ]; then
            echo "Goal already reached."
            exit 0
          fi
          node scripts/update-static-progress.mjs
      - name: Publish changed balance snapshot
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "wallet-progress-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update public wallet balance snapshot"
          git push
          curl --fail --silent --show-error --retry 3 --get \
            "https://api.indexnow.org/indexnow" \
            --data-urlencode "url=https://mundodr.github.io/ten-dollar-wallet-test/" \
            --data-urlencode "key=2a46691b6a9c9d60b70d0c9355ea069f" \
            --data-urlencode "keyLocation=https://mundodr.github.io/ten-dollar-wallet-test/2a46691b6a9c9d60b70d0c9355ea069f.txt"
